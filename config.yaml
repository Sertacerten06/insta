# Arpama Reels — ana ayarlar (CLAUDE.md §2, §6, §10.1)
onay_modu: true            # true: video output/onay_bekleyen/ içine konur, yükleme yapılmaz

takvim:
  saat_dilimi: Europe/Istanbul
  video_gunleri: [Sali, Cuma]
  video_saati: "19:00"
  haber_tarama_araligi_gun: 2

video:
  genislik: 1080
  yukseklik: 1920
  fps: 30
  sanal_genislik: 270       # sahneler 270x480 ızgarada çizilip nearest-neighbor ile x4 büyütülür
  sanal_yukseklik: 480
  sure_min: 110
  sure_max: 130
  scanline_opaklik: 0.12
  guvenli_alan: {ust: 220, alt: 380, sag: 140}

tts:
  servis: elevenlabs        # elevenlabs (bulutta, en kaliteli) | edge (Emel, kadın; bilgisayarda) | piper (bulutta, erkek, yedek) | espeak
  ses: tr-TR-EmelNeural     # marka sesi (kadın), 2026-10-22 kullanıcı isteği
  piper_ses: tr_TR-fahrettin-medium   # marka sesi (erkek). models/piper/ içine indirilir
  elevenlabs:               # 2026-11-07: kullanıcı isteğiyle seslendirme ElevenLabs'ten. Anahtar .env -> ELEVENLABS_API_KEY
    ses_id: cgSgspJ2msm6clMCkdW9   # Jessica (genç, enerjik kadın). Başka ses için ElevenLabs'teki voice_id'yi yaz
    ses_adi: Jessica
    kadin: true             # true ise maskot kız Arpi olur
    model: eleven_v4        # en kaliteli çok dilli model
    dil: tr
    ayarlar: {stability: 0.5, similarity_boost: 0.75}
    tempo: 1.13             # eleven_v4 speed ayarını yok sayıyor; ses ffmpeg atempo ile hızlandırılır (1.0 ile Bölüm 11 ~145 sn çıktı)
  hiz: "+0%"                # Emel yavaş: süre 130 sn üstüne çıkarsa wav atempo ile hızlandırılır (Bölüm 3: 1.16, 4: 1.12)
  hedef_lufs: -16

muzik:
  bpm: 120
  konusma_alti_db: -22
  bosluk_db: -14

instagram:
  handle: "@<instagram_kullanici_adi>"   # §16: kullanıcı dolduracak
